name: Build BudgieOS Full
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential g++-multilib nasm grub-pc-bin xorriso mtools
      - name: Build ISO
        run: make
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgieos-full-iso
          path: build/budgieos-full.iso
